[project]
name = "sagarnetra-backend"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"scripts/demo_scenario.py" = ["E501"]
"scripts/seed_db.py" = ["E501", "E402"]
"tests/*" = ["E501"]
"app/services/ranking.py" = ["E501"]
"app/services/incidents.py" = ["E501"]
"app/routers/incidents.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
